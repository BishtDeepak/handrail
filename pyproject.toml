[project]
name = "handrail"
version = "0.1.0"
description = "Computer-use automation for legacy back-office apps: discover once with an LLM, replay deterministically."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1",
    "typer>=0.12",
    "packaging>=24.0",
]

[project.scripts]
handrail = "handrail.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handrail"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# NFR-03: no outbound network in tests; localhost stays open for MockBank in later phases.
addopts = "-q --strict-markers --allow-hosts=127.0.0.1,::1"
markers = [
    "unit: pure unit tests with fakes",
    "integration: against MockBank with fake planner and judge",
    "e2e: live models; never run in CI",
]

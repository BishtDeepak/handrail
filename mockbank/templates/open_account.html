{% extends "_frame.html" %}{% block body %}
<h2>Open Sub-Account</h2>
<p>Member {{ m.member_id }}</p>
{% if error %}<p><font color="red">{{ error }}</font></p>{% endif %}
<form method="post" action="/frame/members/{{ m.member_id }}/open-account">
<table border="0" cellpadding="3">
<tr><td>Share type</td><td><select name="share_type">{% for t in share_types %}<option>{{ t }}</option>{% endfor %}</select></td></tr>
<tr><td>Initial deposit</td><td><input type="text" name="deposit" size="10"></td></tr>
<tr><td></td><td><input type="submit" value="Review"></td></tr>
</table></form>
{% endblock %}
